name: check

# Verifies this family on every push: parsing tests on saved pages (pytest), then scrape-check, which runs setup_family.py and the
# crawl task against a local stand-in for scrape-hub, the same way the pool runner does, on 2 real queue items (and a rerun).
# Nothing reaches the real hub. Run it by hand too: Actions -> check -> Run workflow.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt pytest "scrape-hub-client @ git+https://github.com/s1d-labs/runner@main#subdirectory=sdk"
          python3 -c "import json; [print(c) for c in json.load(open('scrape.json')).get('setup', [])]" | grep -v "requirements.txt" | while IFS= read -r cmd; do bash -c "$cmd"; done
      - name: Parsing tests
        run: python -m pytest tests -q
      - name: scrape-check (only where the site answers)
        # www.infyner.com refuses GitHub runner IPs at times (2026-11-07: every page blocked). That is the site, not the code:
        # then skip scrape-check; the parsing tests above still run.
        run: |
          page=$(curl -sL -m 30 -A "Mozilla/5.0 (X11; Linux x86_64) s1d-labs research (public company pages)" -w '\n%{http_code}' \
                 https://www.infyner.com/company/robogenius-learning-solutions-limited/U80302DL2011PLC213843 || true)
          if [ "$(tail -n1 <<<"$page")" = 200 ] && ! grep -qiE 'captcha|are you a human|access denied|too many requests|just a moment|cf-chl' <<<"$page"; then
            scrape-check --items 2
          else
            echo "www.infyner.com does not answer this runner (status $(tail -n1 <<<"$page")): scrape-check skipped"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: scrape-check
          path: .scrape-check/
          if-no-files-found: ignore
